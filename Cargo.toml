[workspace]
members = ["programs/*"]
# tests/ is its own workspace: it uses newer host-only crates (pump-rust-client)
# that must never be unified with the on-chain build.
exclude = ["tests"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
